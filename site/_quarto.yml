project:
  type: website
  output-dir: _site
  pre-render:
    - python ../scripts/pre_render.py
  post-render:
    - python ../scripts/post_render.py
  resources:
    - assets/logo.svg
    - "assets/*.js"
    - "data/*.json"

metadata-files:
  - _learn-navigation.yml

website:
  title: "Therapy Skill Kit"
  description: "A reusable Quarto learning site for CBT, DBT, goal setting, wellness, mindfulness, and practical coping skills."
  search:
    location: navbar
    type: overlay
  reader-mode: true
  navbar:
    logo: assets/logo.svg
    logo-alt: "Therapy Skill Kit"
    collapse-below: lg
    left:
      - text: Learn
        href: learn/index.qmd
      - text: Skills Finder
        href: skills-finder/index.qmd
      - text: About
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/backgammonsimplified/therapyskillkit.github.io
        aria-label: GitHub repository
  page-footer:
    left: "Therapy Skill Kit"
    center: "Educational skills practice, not a substitute for professional care."
    right:
      - text: Source
        href: https://github.com/backgammonsimplified/therapyskillkit.github.io

format:
  html:
    theme: [cosmo, assets/tsk-theme.scss]
    css:
      - assets/tsk-shared.css
      - assets/tsk-components.css
    include-in-header:
      - includes/site-head.html
    include-after-body:
      - includes/site-scripts.html
    toc: true
    toc-location: right
    toc-depth: 3
    toc-title: "On this page"
    smooth-scroll: true
    code-copy: true

execute:
  freeze: auto

editor: source
